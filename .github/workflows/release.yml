name: Release Draft

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run build and test checks without drafting a release'
        type: boolean
        required: false
        default: false

jobs:
  release-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit

      - name: Run Pre-commit Hooks
        run: |
          pre-commit run --all-files

      - name: Run Backend Tests
        run: |
          python3 -m unittest discover -s server/tests
          python3 -m unittest discover -s tests

      - name: Run Linter
        working-directory: client
        run: npm run lint

      - name: Run Frontend Tests
        working-directory: client
        run: npm run test

      - name: Build Frontend Production Assets
        working-directory: client
        run: npm run build

      - name: Validate and Build Docker Compose
        run: |
          docker compose config --quiet
          docker compose build

      - name: Package Release Artifacts
        run: |
          python3 scripts/package_release.py --version ${{ github.ref_name }}

      - name: Create Draft Release & Upload Assets
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            dist/planfuge-${{ github.ref_name }}.zip
            dist/planfuge-${{ github.ref_name }}.tar.gz
            dist/planfuge-frontend-${{ github.ref_name }}.zip
            dist/SHA256SUMS

  windows-installer:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      }}
    needs: release-draft
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Windows Packaging Tools
        shell: powershell
        run: |
          choco install tesseract --yes --no-progress
          choco install innosetup --yes --no-progress
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          if (-not (Test-Path "$tessdata\deu.traineddata")) {
            Invoke-WebRequest `
              -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/deu.traineddata" `
              -OutFile "$tessdata\deu.traineddata"
          }

      - name: Build Windows Application and Installer
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.0.0-ci.${{ github.run_number }}"
          }
          ./windows/build.ps1 -Version $version

      - name: Run Windows Launcher Tests
        shell: powershell
        run: python -m unittest windows.test_launcher

      - name: Generate Installer Checksum
        shell: powershell
        run: |
          $installer = Get-ChildItem dist/installer/PlanFuge-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256"

      - name: Upload Windows Installer to Draft Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: |
            dist/installer/PlanFuge-Setup-*.exe
            dist/installer/PlanFuge-Setup-*.exe.sha256

      - name: Upload Windows Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: planfuge-windows-installer
          path: |
            dist/installer/PlanFuge-Setup-*.exe
            dist/installer/PlanFuge-Setup-*.exe.sha256
          if-no-files-found: error
